<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
<title>Document services: company profiles, proposals, CVs and forms</title>
<defs>
<linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#7cf5b4"/></linearGradient>
<linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#7cf5b4"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2647"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#60a5fa" stop-opacity=".45"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="800" height="600" rx="36" fill="#0a0f1e"/>
<rect width="800" height="600" rx="36" fill="url(#grid)"/>
<circle cx="600" cy="140" r="260" fill="url(#halo)"/>
<circle cx="170" cy="500" r="240" fill="url(#halo2)"/>
<g transform="rotate(-8 300 300)"><rect x="150" y="120" width="280" height="360" rx="22" fill="url(#card)" stroke="#2a3658" filter="url(#shadow)" /></g><g transform="rotate(5 340 300)"><rect x="220" y="100" width="280" height="360" rx="22" fill="url(#card)" stroke="#2a3658" filter="url(#shadow)" /></g><rect x="260" y="90" width="300" height="400" rx="22" fill="url(#card)" stroke="#2a3658" filter="url(#shadow)" /><rect x="290" y="124" width="120" height="16" rx="8" fill="url(#g)"/><rect x="290" y="170" width="240" height="10" rx="5" fill="#c9d3ea"/><rect x="290" y="200" width="240" height="10" rx="5" fill="#2a3658"/><rect x="290" y="230" width="170" height="10" rx="5" fill="#2a3658"/><rect x="290" y="260" width="240" height="10" rx="5" fill="#2a3658"/><rect x="290" y="290" width="240" height="10" rx="5" fill="#2a3658"/><rect x="290" y="320" width="170" height="10" rx="5" fill="#2a3658"/><rect x="290" y="360" width="110" height="80" rx="10" fill="#18223f" stroke="#2a3658"/><rect x="306" y="380" width="70" height="8" rx="5" fill="#60a5fa"/><rect x="306" y="398" width="50" height="8" rx="5" fill="#2a3658"/><path d="M440 420c20-30 40 10 60-20" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/><g transform="translate(600 420)"><circle r="56" fill="#7cf5b4" opacity=".18"/><circle cx="0" cy="0" r="38" fill="#7cf5b4"/><path d="M-17.1 0l11.4 12.16 22.8-23.56" fill="none" stroke="#0a0f1e" stroke-width="8.36" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(620 170) rotate(35)"><rect x="-12" y="-110" width="24" height="170" rx="10" fill="#8b5cf6"/><path d="M-12 60h24l-12 34z" fill="#e8ecf5"/></g><path transform="translate(140 110) scale(1)" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14z" fill="#7cf5b4" filter="url(#glow)"/>
</svg>